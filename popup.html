<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Is This AI?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #161920;
    --border:    #252830;
    --ai-red:    #ff3b3b;
    --ai-amber:  #f59e0b;
    --ai-green:  #22c55e;
    --ai-blue:   #38bdf8;
    --text:      #e8eaf0;
    --muted:     #6b7280;
    --mono:      'Space Mono', monospace;
    --sans:      'DM Sans', sans-serif;
  }

  html { width: 360px; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    width: 360px;
    min-height: 200px;
    overflow-x: hidden;
  }

  /* ── Header ─────────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .header-icon {
    width: 28px; height: 28px;
    background: var(--ai-red);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(255,59,59,0.4);
  }

  .header-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text);
    text-transform: uppercase;
  }

  .header-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .refresh-btn {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    width: 28px; height: 28px;
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .refresh-btn:hover { color: var(--text); border-color: #3f4450; }
  .refresh-btn.spinning { animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Verdict card ────────────────────────────────── */
  .verdict {
    margin: 12px 12px 0;
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .verdict::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background: radial-gradient(ellipse at top left, var(--verdict-color) 0%, transparent 70%);
    pointer-events: none;
  }

  .verdict-label {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .verdict-main {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .verdict-emoji { font-size: 26px; line-height: 1; }

  .verdict-text {
    font-size: 18px;
    font-weight: 600;
    color: var(--verdict-color);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }

  .verdict-desc {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-top: 2px;
  }

  /* ── Confidence bar ──────────────────────────────── */
  .confidence-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .confidence-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 80px;
  }

  .bar-track {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--verdict-color);
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 6px var(--verdict-color);
  }

  .confidence-pct {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--verdict-color);
    min-width: 34px;
    text-align: right;
  }

  /* ── Detections list ─────────────────────────────── */
  .section {
    margin: 10px 12px 0;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .detection-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .detection-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .detection-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .detection-via {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
  }

  .detection-badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .badge-ai       { background: rgba(239,68,68,0.15);  color: #ef4444; }
  .badge-likely   { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .badge-possible { background: rgba(56,189,248,0.15); color: #38bdf8; }
  .badge-human    { background: rgba(34,197,94,0.15);  color: #22c55e; }
  .badge-network  { background: rgba(167,139,250,0.15);color: #a78bfa; }

  /* ── Empty state ─────────────────────────────────── */
  .empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }

  .empty-icon { font-size: 28px; margin-bottom: 8px; }

  /* ── Loading ─────────────────────────────────────── */
  .loading {
    padding: 30px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  .loading-dots span {
    display: inline-block;
    width: 5px; height: 5px;
    margin: 0 2px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite both;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40%           { transform: scale(1);   opacity: 1; }
  }

  /* ── URL bar ─────────────────────────────────────── */
  .url-bar {
    margin: 0 12px 12px;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Footer ──────────────────────────────────────── */
  .footer {
    margin-top: 10px;
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .footer-scan { font-family: var(--mono); }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-meta {
    font-size: 9px;
    color: var(--muted);
    justify-content: center;
    padding-top: 5px;
    margin-top: 5px;
    border-top: 1px solid var(--border);
  }

  .footer-meta a {
    color: var(--text);
    text-decoration: none;
  }

  .footer-meta a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🤖</div>
  <div>
    <div class="header-title">Is This AI?</div>
    <div class="header-sub">Chat Detection Scanner</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" title="Re-scan page">↻</button>
</div>

<div id="app">
  <div class="loading">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <div style="margin-top:10px">Scanning page…</div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
